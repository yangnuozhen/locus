name: Build unsigned IPA (artifact)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build and verify unsigned device IPA
        run: scripts/build-unsigned-ipa.sh
      - name: Upload IPA, checksum, source revision, and build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Locus-unsigned-${{ github.sha }}
          path: outputs/
          if-no-files-found: error
          retention-days: 14
